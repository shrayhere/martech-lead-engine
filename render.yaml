# Render Blueprint — MarTech Lead Engine (100% Free Plan)
services:
  - type: web
    name: martech-lead-engine-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        value: "sqlite:///./martech.db"
      - key: CORS_ORIGINS
        value: "https://frontend-pied-seven-l2r7e4glw8.vercel.app,http://localhost:3000,http://localhost:5173"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_SYNC_INTERVAL_HOURS
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
